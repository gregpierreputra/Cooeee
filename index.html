<!doctype html>
<html lang="en-AU" data-mode="prepare">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070C11" />
    <!-- Installing to the home screen is a DATA-DURABILITY feature, not polish:
         iOS clears script-writable storage after seven days of non-use, and an
         installed web app is exempt. -->
    <!-- Preloaded so the first paint already has the face, and so screens that
         guarantee zero runtime requests never trigger a late font fetch. -->
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta
      name="description"
      content="Cooeee assembles official bushfire information for a place while you have a connection, and keeps it usable when you do not."
    />
    <title>Cooeee</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
